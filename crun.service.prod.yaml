apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: openleaf-compiler
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/minScale: "0"
    spec:
      # Isolate instances to 2 concurrent compiles per container for stability and predictable CPU
      containerConcurrency: 2
      timeoutSeconds: 300
      containers:
      - image: gcr.io/openleaf-508614/openleaf-compiler:latest
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            memory: 1Gi
            cpu: "1000m"
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 2
          failureThreshold: 15
        env:
        - name: PORT
          value: "8080"
        - name: ENV
          value: "production"
        - name: GCS_BUCKET
          value: "openleaf-artifacts-asia-southeast1"
        - name: USE_LOCAL_STORAGE
          value: "false"
